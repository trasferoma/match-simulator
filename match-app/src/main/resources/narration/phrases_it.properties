KICK_OFF = Fischio d'inizio: si parte! | \
    L'arbitro dà il via alla partita. | \
    Comincia la gara, palla al centro.
SECOND_HALF_START = Comincia la ripresa. | \
    Si riparte: inizia il secondo tempo. | \
    Squadre in campo, via al secondo tempo.
FIRST_HALF_END = Finisce il primo tempo: squadre negli spogliatoi. | \
    Triplice fischio, è l'intervallo. | \
    L'arbitro manda tutti al riposo: fine del primo tempo.
MATCH_END = Fischio finale: la partita è finita. | \
    Triplice fischio, finisce qui. | \
    L'arbitro chiude la gara.
MATCH_SUSPENDED = Partita sospesa: una squadra è rimasta con meno di sette giocatori. | \
    L'arbitro interrompe definitivamente la gara: troppi giocatori in meno per proseguire.
STOPPAGE_ANNOUNCED = Il quarto uomo alza il tabellone: minuti di recupero {minutes}. | \
    Minuti di recupero concessi dall'arbitro: {minutes}. | \
    Si giocherà ancora, minuti di recupero: {minutes}.
KICK_OFF_AFTER_GOAL = Si riparte dal centrocampo. | \
    Palla al centro, si ricomincia.

PASS_COMPLETED = {player} imposta con un passaggio preciso. | \
    Bel passaggio di {player}, la squadra guadagna terreno. | \
    {player} gioca la palla in avanti.
DRIBBLE_COMPLETED = {player} salta l'uomo e avanza palla al piede. | \
    Dribbling riuscito per {player}. | \
    {player} se ne va in dribbling.
INTERCEPTION = {player} intercetta il passaggio e recupera palla. | \
    Intercetto di {player}: palla cambiata di mano. | \
    {player} legge la traiettoria e si prende il pallone.
TACKLE = {player} vince il contrasto e recupera palla. | \
    Contrasto vinto da {player}, il pallone cambia squadra. | \
    {player} chiude con un'entrata pulita e si riprende la palla.
GOAL_KICK = Rimessa dal fondo: batte {player}. | \
    {player} rimette in gioco dal fondo.
CROSS_COMPLETED = {player} crossa in area e la palla arriva in mezzo. | \
    Traversone di {player} che trova l'area. | \
    {player} mette un cross invitante in area.
CROSS_FAILED = Cross di {player} fuori misura, la difesa se la prende. | \
    {player} prova il cross, ma non trova nessuno. | \
    Traversone sbagliato di {player}: palla alla difesa.
CLEARANCE.WITH_SECONDARY = {player} respinge il cross di {secondary}. | \
    Il traversone di {secondary} viene allontanato da {player}. | \
    {player} spazza l'area sul cross di {secondary}.
CORNER_KICK = Calcio d'angolo: batte {player}. | \
    Angolo per la squadra, va sul pallone {player}. | \
    {player} va dalla bandierina per l'angolo.
FREE_KICK = Punizione: batte {player}. | \
    {player} rimette in gioco con un calcio di punizione.
FREE_KICK_CROSS = Punizione dalla trequarti: {player} crossa in area. | \
    {player} batte la punizione con un traversone in mezzo all'area.
OFFSIDE_FREE_KICK = Punizione per il fuorigioco, la batte {player}. | \
    Fuorigioco fischiato: {player} riprende il gioco.
OFFSIDE.WITH_SECONDARY = {player} è in fuorigioco: la bandierina si alza sul passaggio di {secondary}. | \
    Fuorigioco di {player}, lanciato da {secondary}. | \
    Il lancio di {secondary} per {player} è viziato dal fuorigioco.

YELLOW_CARD = Cartellino giallo per {player}. | \
    {player} viene ammonito.
SECOND_YELLOW_CARD = Secondo giallo per {player}: è espulso! | \
    {player} viene ammonito per la seconda volta e deve lasciare il campo.
RED_CARD = Cartellino rosso diretto per {player}: espulso! | \
    {player} viene espulso, rosso diretto.
INJURY = {player} resta a terra: si ferma il gioco per un infortunio. | \
    Infortunio per {player}, serve l'intervento dei sanitari.
SUBSTITUTION.WITH_SECONDARY = Cambio: esce {player}, al suo posto entra {secondary}. | \
    {secondary} subentra a {player}. | \
    Sostituzione: lascia il campo {player}, dentro {secondary}.

FOUL.LIGHT.WITH_SECONDARY = Fallo lieve di {player} su {secondary}. | \
    {player} commette un fallo leggero ai danni di {secondary}.
FOUL.HARD.WITH_SECONDARY = Fallo duro di {player} su {secondary}. | \
    {player} ferma duramente {secondary}.
FOUL.RECKLESS.WITH_SECONDARY = Fallo imprudente di {player} su {secondary}. | \
    Entrata avventata di {player} su {secondary}.
FOUL.LIGHT.PENALTY.WITH_SECONDARY = Fallo lieve di {player} su {secondary} in area: l'arbitro concede il rigore. | \
    {player} tocca in modo leggero {secondary} dentro l'area, ed è rigore.
FOUL.HARD.PENALTY.WITH_SECONDARY = Fallo duro di {player} su {secondary} in area: calcio di rigore! | \
    {player} stende duramente {secondary} in area, ed è rigore.
FOUL.RECKLESS.PENALTY.WITH_SECONDARY = Entrata imprudente di {player} su {secondary} in area: è rigore! | \
    {player} interviene in modo avventato su {secondary} in area: l'arbitro indica il dischetto.

GOAL.FOOT = Gol! {player} batte il portiere. | \
    Rete di {player}, che non sbaglia davanti alla porta. | \
    {player} calcia e la palla finisce in rete.
GOAL.HEADER.WITH_SECONDARY = Gol di testa di {player}, su cross di {secondary}! | \
    {secondary} mette in mezzo e {player} di testa insacca. | \
    Traversone di {secondary}, stacco di {player} e palla in rete!
GOAL.DIRECT_FREE_KICK = Gol su punizione! {player} la mette dentro. | \
    {player} calcia la punizione e trova la rete.
GOAL.PENALTY = Gol su rigore: {player} spiazza il portiere. | \
    {player} dal dischetto non sbaglia: è gol.

GOAL_CONTEXT.TAKES_THE_LEAD = {player} porta in vantaggio la sua squadra. | \
    Con questo gol la squadra di {player} passa in vantaggio.
GOAL_CONTEXT.EQUALISER = {player} firma il pareggio. | \
    Con questo gol di {player} la partita torna in parità.
GOAL_CONTEXT.BRACE = È la doppietta di {player}! | \
    Doppietta per {player}, che segna ancora.
GOAL_CONTEXT.HAT_TRICK = Tripletta per {player}: tre gol in una partita! | \
    {player} firma una tripletta personale!

SHOT_SAVED.PENALTY.WITH_SECONDARY = {player} dal dischetto, ma {secondary} para il rigore. | \
    Rigore parato! {secondary} ferma il tiro di {player}.
SHOT_SAVED.ROUTINE.WITH_SECONDARY = {player} calcia, parata normale di {secondary}. | \
    Tiro di {player}, {secondary} blocca con tranquillità. | \
    {secondary} para in modo comodo il tiro di {player}.
SHOT_SAVED.DIFFICULT.WITH_SECONDARY = {player} tira forte, {secondary} compie una parata difficile. | \
    Intervento difficile di {secondary} sul tiro di {player}. | \
    {secondary} è bravo a respingere un tiro complicato di {player}.
SHOT_SAVED.SPECTACULAR.WITH_SECONDARY = Parata prodigiosa di {secondary} sul tiro di {player}! | \
    {player} calcia, ma {secondary} fa un autentico miracolo! | \
    Strepitoso {secondary}: vola e nega il gol a {player}.

SHOT_OFF_TARGET.PENALTY = {player} sbaglia il rigore: palla fuori! | \
    Rigore calciato fuori da {player}.
SHOT_OFF_TARGET.ATTEMPT = Tentativo di {player}, la palla finisce fuori. | \
    {player} azzarda il tiro, ma non inquadra la porta. | \
    Un tentativo velleitario di {player}, fuori di molto.
SHOT_OFF_TARGET.HALF_CHANCE = Discreta occasione per {player}, che calcia fuori. | \
    {player} ha una mezza occasione ma spedisce la palla a lato. | \
    Buona chance per {player}: tiro fuori di poco.
SHOT_OFF_TARGET.BIG_CHANCE = Grande occasione sprecata da {player}: palla fuori! | \
    {player} si divora una palla gol, il tiro finisce fuori. | \
    Errore clamoroso di {player}, che calcia a lato.
SHOT_OFF_TARGET.ATTEMPT.WITH_SECONDARY = Tentativo di testa di {player} sul cross di {secondary}, ma la palla va fuori. | \
    {secondary} crossa e {player} azzarda la girata di testa: fuori.
SHOT_OFF_TARGET.HALF_CHANCE.WITH_SECONDARY = Discreta occasione di testa per {player} sul cross di {secondary}, palla alta. | \
    Il cross di {secondary} regala a {player} una mezza occasione, ma il colpo di testa è fuori.
SHOT_OFF_TARGET.BIG_CHANCE.WITH_SECONDARY = Grande occasione per {player} di testa su cross di {secondary}, ma la palla è fuori! | \
    {secondary} la mette in mezzo, {player} si divora una palla gol di testa.

SHOT_BLOCKED.ATTEMPT = Tentativo di {player} murato dalla difesa. | \
    {player} azzarda il tiro, ma un difensore si frappone. | \
    Un tentativo velleitario di {player} che si spegne sui difensori.
SHOT_BLOCKED.HALF_CHANCE = Discreta occasione per {player}, ma la difesa mura il tiro. | \
    {player} ha una mezza occasione, ma il tiro è respinto da un difensore.
SHOT_BLOCKED.BIG_CHANCE = Grande occasione per {player}, ma la difesa mura il tiro! | \
    {player} ha una palla gol sui piedi, ma un difensore si getta sul tiro.
SHOT_BLOCKED.ATTEMPT.WITH_SECONDARY = Tentativo di {player} sul cross di {secondary}, murato dalla difesa. | \
    {secondary} crossa, {player} azzarda la conclusione ma la difesa respinge.
SHOT_BLOCKED.HALF_CHANCE.WITH_SECONDARY = Discreta occasione per {player} sul cross di {secondary}, ma la difesa mura. | \
    {secondary} serve una mezza occasione a {player}, ma il tiro è murato.
SHOT_BLOCKED.BIG_CHANCE.WITH_SECONDARY = Grande occasione per {player} sul cross di {secondary}, ma la difesa mura il tiro! | \
    {secondary} mette in mezzo una palla gol per {player}, ma un difensore blocca.
