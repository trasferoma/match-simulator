# Configurazione della modalita' highlights: e' l'unico punto in cui si decide cosa ferma l'animazione.
# Dopo una modifica serve di nuovo "mvn package", perche' il file sta nel classpath.
# Ogni valore di EventType ha la sua chiave "event.<TIPO>": se ne manca una la modalita' non parte.
#
# CHANCE: occasione da gol, con le righe di preparazione, la riga del tiro e per il gol quella del contesto.
#         Ammesso solo su GOAL, SHOT_SAVED, SHOT_OFF_TARGET, SHOT_BLOCKED.
# ONE_LINE: ferma l'animazione e si racconta con una riga.
# ONE_LINE_IF_LINKED_TO_CHANCE: una riga se l'evento e' legato a un'occasione o se la sua zona e' fra quelle di
#         "alsoStopsInZones.<TIPO>" (elenco di ZoneRole separati da virgola, anche vuoto); altrimenti solo
#         animazione. Ammesso solo su CORNER_KICK e OFFSIDE, che richiedono la chiave alsoStopsInZones.
# ANIMATION_ONLY: solo animazione.

event.KICK_OFF = ONE_LINE
event.STOPPAGE_ANNOUNCED = ONE_LINE
event.FIRST_HALF_END = ONE_LINE
event.SECOND_HALF_START = ONE_LINE
event.MATCH_END = ONE_LINE
event.MATCH_SUSPENDED = ONE_LINE
event.PASS_COMPLETED = ANIMATION_ONLY
event.DRIBBLE_COMPLETED = ANIMATION_ONLY
event.INTERCEPTION = ANIMATION_ONLY
event.TACKLE = ANIMATION_ONLY
event.BALL_CIRCULATED = ANIMATION_ONLY
event.GOAL = CHANCE
event.SHOT_SAVED = CHANCE
event.SHOT_OFF_TARGET = CHANCE
event.SHOT_BLOCKED = CHANCE
event.GOAL_KICK = ANIMATION_ONLY
event.KICK_OFF_AFTER_GOAL = ONE_LINE
event.CROSS_COMPLETED = ANIMATION_ONLY
event.CROSS_FAILED = ANIMATION_ONLY
event.CROSS_DEFLECTED_TO_CORNER = ANIMATION_ONLY
event.CLEARANCE = ANIMATION_ONLY
event.CORNER_KICK = ONE_LINE_IF_LINKED_TO_CHANCE
event.FOUL = ANIMATION_ONLY
event.FREE_KICK = ANIMATION_ONLY
event.FREE_KICK_CROSS = ANIMATION_ONLY
event.OFFSIDE = ONE_LINE_IF_LINKED_TO_CHANCE
event.OFFSIDE_FREE_KICK = ANIMATION_ONLY
event.YELLOW_CARD = ONE_LINE
event.SECOND_YELLOW_CARD = ONE_LINE
event.RED_CARD = ONE_LINE
event.INJURY = ONE_LINE
event.SUBSTITUTION = ONE_LINE

# Zone dell'evento (ZoneRole: OWN_BOX, DEFENCE, MIDFIELD, ATTACKING_THIRD, OPPONENT_BOX) in cui il tipo ferma
# l'animazione anche senza un'occasione. Per OFFSIDE e' la zona di partenza del passaggio, vista da chi attacca.
alsoStopsInZones.CORNER_KICK =
alsoStopsInZones.OFFSIDE = ATTACKING_THIRD

# Righe di preparazione di un'occasione al massimo, e quanti eventi dopo il tiro contano come conseguenza.
chance.maxPreparationLines = 4
chance.consequenceWindow = 2

# Pause in millisecondi: fotogramma, riga di un evento, riga di un'occasione, dopo il gol, ripresa dell'animazione.
pause.frameMillis = 150
pause.eventLineMillis = 1000
pause.chanceLineMillis = 1500
pause.afterGoalMillis = 2500
pause.resumeMillis = 800
